name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  libft:
    name: libft norminette and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install norminette
        run: python -m pip install --upgrade norminette

      - name: Run norminette
        working-directory: C/cercle-00/libft
        run: norminette .

      - name: Build libft
        working-directory: C/cercle-00/libft
        run: make

  get-next-line:
    name: get_next_line norminette and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install norminette
        run: python -m pip install --upgrade norminette

      - name: Run norminette
        working-directory: C/cercle-01/get_next_line
        run: norminette get_next_line.c get_next_line_utils.c get_next_line.h

      - name: Compile get_next_line
        working-directory: C/cercle-01/get_next_line
        run: cc -Wall -Wextra -Werror -D BUFFER_SIZE=42 -c get_next_line.c get_next_line_utils.c

  ft-printf:
    name: ft_printf norminette and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install norminette
        run: python -m pip install --upgrade norminette

      - name: Run norminette
        working-directory: C/cercle-01/ft_printf
        run: norminette .

      - name: Build ft_printf
        working-directory: C/cercle-01/ft_printf
        run: make

  call-me-maybe:
    name: call-me-maybe tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        working-directory: Python/cercle-03/call-me-maybe
        run: uv sync --dev

      - name: Run tests
        working-directory: Python/cercle-03/call-me-maybe
        run: uv run pytest

  fly-in:
    name: fly-in tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        working-directory: Python/cercle-03/fly-in
        run: python -m unittest discover -s tests
